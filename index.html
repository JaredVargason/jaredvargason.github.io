---
layout: default
title: projects
---

<div class="projects">
  <h1>Jared Vargason</h1>
  <h2>Projects</h2>
  {% assign projects = site.projects | sort: "order", "last" %}
  {% for project in projects %}
  <a class="project" href="{{ project.link }}">
    {% if project.picture_name %}
    <img class="project-image" src="{{ site.baseurl }}/static/images/{{ project.picture_name }}" alt="">
    {% endif %}
    <div class="project-text">
      <div class="title">{{ project.name }}</div>
      <div class="description">{{ project.description }}</div>
    </div>
  </a>
  {% endfor %}
</div>
