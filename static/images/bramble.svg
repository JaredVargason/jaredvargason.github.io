<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Bramble</title>
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="#4a9d3f"/>
  <g clip-path="url(#tile)">
    <!-- Staff -->
    <path d="M0 268 H512 M0 304 H512 M0 340 H512 M0 376 H512 M0 412 H512" stroke="#ffffff" stroke-width="6" opacity="0.28"/>
    <!-- Note stems hang from the vine -->
    <g stroke="#ffffff" stroke-width="16" stroke-linecap="round">
      <path d="M148 133 V262"/>
      <path d="M262 238 V334"/>
      <path d="M381 303 V406"/>
    </g>
    <!-- Vine, growing in from the top-left corner and out past the bottom-right -->
    <path d="M-30 64 C110 40 190 200 262 238 C334 276 430 290 540 520"
          fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round"/>
  </g>
  <!-- Leaves -->
  <g fill="#ffffff">
    <path d="M172 154 Q181 98 241 84 Q237 142 172 154 Z"/>
    <path d="M322 266 Q348 214 408 222 Q384 276 322 266 Z"/>
  </g>
  <!-- Noteheads, sitting on the staff lines -->
  <g fill="#ffffff">
    <ellipse cx="122" cy="270" rx="36" ry="27" transform="rotate(-22 122 270)"/>
    <ellipse cx="236" cy="342" rx="36" ry="27" transform="rotate(-22 236 342)"/>
    <ellipse cx="355" cy="414" rx="36" ry="27" transform="rotate(-22 355 414)"/>
  </g>
</svg>
