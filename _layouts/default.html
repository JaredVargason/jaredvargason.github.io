<!DOCTYPE html>
<html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      {% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}
      {% if page.icon %}<link rel="icon" type="image/svg+xml" href="{{ site.baseurl }}{{ page.icon }}">{% endif %}
      <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/static/style.css">
      <title>{% if page.title %}{{ page.title }} · {% endif %}jaredvargason</title>
    </head>
    <body>
      <main class="container">
        {% if page.url != "/" %}<a class="back" href="{{ site.baseurl }}/">← jaredvargason</a>{% endif %}
        {{ content }}
      </main>
      <footer class="footer">
        <a href="{{ site.baseurl }}/">jaredvargason</a>
        <span>·</span>
        <a href="{{ site.baseurl }}/bramble/">Bramble</a>
      </footer>
    </body>
</html>
